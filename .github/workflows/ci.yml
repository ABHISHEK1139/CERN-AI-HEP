name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU, no optional accelerators)
        run: |
          python -m pip install --upgrade pip
          # CPU torch first; requirements.txt's `torch>=2.0` is then already
          # satisfied so pip will not overwrite it with a CUDA wheel.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric pytest pyyaml numpy scipy pandas scikit-learn tqdm matplotlib networkx
          grep -v -E "^torch(vision)?>=|^torch-geometric>=" requirements.txt > /tmp/req_rest.txt
          pip install -r /tmp/req_rest.txt || pip install pyyaml numpy scipy pandas scikit-learn tqdm matplotlib networkx

      - name: Smoke test (synthetic GCN, CPU)
        run: |
          python experiments/train_classifier.py --config experiments/configs/smoke.yaml --model gcn --epochs 2 --device cpu

      - name: Unit tests (heavy data skipped gracefully)
        run: |
          python -m pytest -rs
